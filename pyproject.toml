[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fastgx"
version = "3.0.0"
description = "Embedded native property graphs with scoped, nested traversal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BRAHMAI", email = "hello@brahmai.in" }]
dependencies = ["msgpack>=1.0", "click>=8.0", "pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.0", "ruff>=0.9"]
performance = ["psutil>=5.9", "networkx>=3.0"]

[project.scripts]
fastgraph = "fastgraph.cli.main:main"

[project.urls]
Source = "https://github.com/cognition-brahmai/fastgraph"
Issues = "https://github.com/cognition-brahmai/fastgraph/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "fastgraph._native"
python-source = "."
features = ["python-extension"]
include = ["LICENSE", "README.md", "tests/**/*.py", "test_original_code.py", "examples/nested_graphs.py", "benchmarks/graph_engine.py"]
exclude = ["fastgraph/*.pdb", "fastgraph/*.dll", "fastgraph/**/*.pyc", "fastgraph/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["performance: optional performance measurements"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["fastgraph/core/*.py", "fastgraph/cli/*.py", "fastgraph/__init__.py", "tests/*.py", "examples/nested_graphs.py", "benchmarks/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["fastgraph.core", "fastgraph.cli"]
omit = ["fastgraph/core/__init__.py"]
