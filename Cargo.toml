[package]
name = "fastgraph-native"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "_native"
path = "native/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310", "auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 1
