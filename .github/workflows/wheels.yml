name: Native Wheel Artifacts

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test artifacts without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.project.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read package metadata and validate a release tag
        id: project
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name, version = project["name"], project["version"]
          ref = os.environ["RELEASE_REF"]
          expected_ref = f"refs/tags/v{version}"
          if ref.startswith("refs/tags/") and ref != expected_ref:
              raise SystemExit(f"Tag {ref} does not match {name} {version}")
          publish_requested = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              and os.environ["DRY_RUN"] == "false"
          )
          if publish_requested and ref != expected_ref:
              raise SystemExit(f"Publishing requires manual dispatch on {expected_ref}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Building {name} {version}; publishing requested: {publish_requested}")

  wheels:
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            interpreter: python3.10
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            interpreter: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build an ABI3 wheel from project metadata
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter ${{ matrix.interpreter }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build a source distribution from project metadata
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  artifact-tests:
    needs: [metadata, wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - name: Install the built wheel with test dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one platform wheel, found {len(wheels)}")
          subprocess.run(
              [sys.executable, "-m", "pip", "install", f"{wheels[0].resolve()}[dev]"],
              check=True,
          )
      - name: Test wheel imports and the suite outside the checkout
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          smoke = """
          from importlib import metadata
          import json
          from pathlib import Path
          import sys
          import fastgraph
          from fastgraph import FastGraph, _native
          from fastgraph.cli.main import main
          from click.testing import CliRunner

          source = Path(sys.argv[1]).resolve()
          expected_version = sys.argv[2]
          distribution = metadata.distribution("fastgx")
          if distribution.version != fastgraph.__version__ or distribution.version != expected_version:
              raise SystemExit("Wheel metadata, runtime and project versions differ")
          packaged = {Path(distribution.locate_file(file)).resolve()
                      for file in distribution.files or ()}
          for filename in (fastgraph.__file__, _native.__file__):
              path = Path(filename).resolve()
              if path.is_relative_to(source) or path not in packaged:
                  raise SystemExit(f"Import is not from the installed wheel: {path}")
              print(f"Installed import: {path}")
          if not any(entry.group == "console_scripts" and entry.name == "fastgraph"
                     and entry.value == "fastgraph.cli.main:main"
                     for entry in distribution.entry_points):
              raise SystemExit("Missing fastgraph console entry point")
          graph = FastGraph("wheel-smoke")
          graph.add_nodes_batch([("one", {"value": 1}), ("two", {"value": 2})])
          graph.add_edges_batch([("one", "two", "next", {})])
          loaded = FastGraph.from_file(graph.save("smoke.json"))
          if loaded.get_node("two")["value"] != 2 or not loaded.has_edge("one", "two", "next"):
              raise SystemExit("Installed native graph/persistence smoke failed")
          result = CliRunner().invoke(main, ["--format", "json", "version"])
          if result.exit_code != 0 or json.loads(result.output)["version"] != distribution.version:
              raise SystemExit(f"Installed CLI smoke failed: {result.output}")
          graph.close()
          loaded.close()
          print(f"Wheel checks passed: fastgx {distribution.version}")
          """
          source = Path.cwd()
          env = os.environ.copy()
          env.pop("PYTHONPATH", None)
          with tempfile.TemporaryDirectory(prefix="fastgraph-wheel-") as directory:
              target = Path(directory)
              shutil.copytree(source / "tests", target / "tests")
              shutil.copy2(source / "pyproject.toml", target / "pyproject.toml")
              shutil.copy2(source / "test_original_code.py", target / "test_original_code.py")
              env["HOME"] = env["USERPROFILE"] = str(target)
              env["FASTGRAPH_DATA_DIR"] = str(target / "data")
              subprocess.run(
                  [sys.executable, "-I", "-c", smoke, str(source), env["EXPECTED_VERSION"]],
                  cwd=target, env=env, check=True,
              )
              subprocess.run(
                  [sys.executable, "-I", "-m", "pytest", "tests/", "-v",
                   "--strict-markers", "--import-mode=importlib", "-p", "no:cacheprovider"],
                  cwd=target, env=env, check=True,
              )

  check-artifacts:
    needs: [wheels, sdist, artifact-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

  publish:
    needs: [metadata, check-artifacts]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.dry_run == false
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish explicitly approved release artifacts
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
